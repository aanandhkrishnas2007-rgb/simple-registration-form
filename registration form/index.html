```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hackathon Registration</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            background:
                linear-gradient(135deg, #050b18, #101b35);

            color: white;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;
        }


        .form-box {

            width: 100%;

            max-width: 500px;

            background: rgba(10, 18, 35, 0.95);

            padding: 35px;

            border-radius: 15px;

            border: 1px solid #00f7ff;

            box-shadow:
                0 0 30px
                rgba(0, 247, 255, 0.2);
        }


        h2 {

            text-align: center;

            color: #00f7ff;

            margin-bottom: 10px;
        }


        .subtitle {

            text-align: center;

            color: #9ca3af;

            margin-bottom: 25px;

            font-size: 14px;
        }


        label {

            display: block;

            margin-top: 15px;

            margin-bottom: 6px;

            color: #00f7ff;

            font-size: 14px;
        }


        input,
        textarea {

            width: 100%;

            padding: 12px;

            background: #050b18;

            color: white;

            border: 1px solid #334155;

            border-radius: 6px;

            outline: none;

            font-size: 15px;
        }


        input:focus,
        textarea:focus {

            border-color: #00f7ff;

            box-shadow:
                0 0 10px
                rgba(0, 247, 255, 0.3);
        }


        textarea {

            resize: vertical;

            min-height: 100px;
        }


        button {

            width: 100%;

            padding: 14px;

            margin-top: 25px;

            border: none;

            border-radius: 6px;

            background: #00f7ff;

            color: #020617;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        button:hover {

            transform: scale(1.02);

            box-shadow:
                0 0 20px
                rgba(0, 247, 255, 0.4);
        }


        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;
        }


        #message {

            text-align: center;

            margin-top: 20px;

            font-weight: bold;

            min-height: 20px;
        }

    </style>

</head>


<body>


<div class="form-box">

    <h2>⚡ HACKATHON REGISTRATION</h2>

    <p class="subtitle">
        Register your team for the event
    </p>


    <form id="registrationForm">


        <!-- Student Name -->

        <label>Student Name</label>

        <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            required
        >


        <!-- Email -->

        <label>Email Address</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >


        <!-- Phone -->

        <label>Phone Number</label>

        <input
            type="tel"
            id="phone"
            placeholder="Enter your phone number"
            required
        >


        <!-- College -->

        <label>College Name</label>

        <input
            type="text"
            id="college"
            placeholder="Enter your college name"
            required
        >


        <!-- Team -->

        <label>Team Name</label>

        <input
            type="text"
            id="team"
            placeholder="Enter your team name"
            required
        >


        <!-- Project -->

        <label>Project Idea</label>

        <textarea
            id="project"
            placeholder="Describe your project idea"
            required
        ></textarea>


        <!-- Submit Button -->

        <button
            type="submit"
            id="submitBtn"
        >
            ⚡ REGISTER NOW
        </button>


        <!-- Status Message -->

        <p id="message"></p>


    </form>

</div>



<script>


    // ==========================================
    // GOOGLE APPS SCRIPT URL
    // ==========================================

    const scriptURL =
        "https://script.google.com/macros/s/AKfycbxqDT-BwPtqPx9ryJdfLY-mDoRgcTEpcIvVYSf4W-5e-SRst9YHgWjhSkbwSfvFO0Vy0w/exec";


    // ==========================================
    // GET HTML ELEMENTS
    // ==========================================

    const form =
        document.getElementById("registrationForm");


    const submitBtn =
        document.getElementById("submitBtn");


    const message =
        document.getElementById("message");


    // ==========================================
    // FORM SUBMISSION
    // ==========================================

    form.addEventListener(
        "submit",
        async function(event) {


            // Stop page refresh

            event.preventDefault();


            // Disable button

            submitBtn.disabled = true;


            submitBtn.innerText =
                "⚡ REGISTERING...";


            // Show sending message

            message.style.color =
                "#00f7ff";


            message.innerText =
                "Sending registration...";


            // ==========================================
            // COLLECT FORM DATA
            // ==========================================

            const data = {

                name:
                    document
                    .getElementById("name")
                    .value,

                email:
                    document
                    .getElementById("email")
                    .value,

                phone:
                    document
                    .getElementById("phone")
                    .value,

                college:
                    document
                    .getElementById("college")
                    .value,

                team:
                    document
                    .getElementById("team")
                    .value,

                project:
                    document
                    .getElementById("project")
                    .value

            };


            // ==========================================
            // SEND DATA TO GOOGLE SHEET
            // ==========================================

            try {


                await fetch(

                    scriptURL,

                    {

                        method: "POST",

                        mode: "no-cors",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify(data)

                    }

                );


                // ==========================================
                // SUCCESS MESSAGE
                // ==========================================

                message.style.color =
                    "#00ff88";


                message.innerText =
                    "✓ Registration successful! Redirecting...";


                // Reset form

                form.reset();


                // ==========================================
                // REDIRECT TO COMPLETED PAGE
                // ==========================================

                setTimeout(() => {

                    window.location.href =
                        "completed.html";

                }, 1500);


            }


            catch (error) {


                console.error(error);


                message.style.color =
                    "#ff4444";


                message.innerText =
                    "✕ Registration failed. Please try again.";


                submitBtn.disabled = false;


                submitBtn.innerText =
                    "⚡ REGISTER NOW";

            }


        }
    );


</script>


</body>

</html>
